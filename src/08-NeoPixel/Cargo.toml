[package]
name = "neopixel"
version = "0.1.0"
authors = ["Freenove <support@freenove.com>"]
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"
microbit-v2 = "0.15.1"
embedded-hal = "1.0.0"
smart-leds-trait = "0.3.2"
ws2812-nrf52833-pwm = "0.2.1"
smart-leds = "0.4.0"
ws2812-spi = "0.5.1"
nrf52833-hal = "0.18.0"

[dependencies.cortex-m]
version = "0.7.7"
features = ["inline-asm", "critical-section-single-core"]

[dependencies.nrf52833-pac]
version = "0.12.2"
features = ["cortex-m-rt"]

[dependencies.serial-setup]
version = "0.1.0"
path = "../serial-setup"
